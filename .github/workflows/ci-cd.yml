name: Rehouse CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only pull-request runs may be cancelled by a newer push. Runs on main publish and deploy to
# production; cancelling them mid-deploy can kill the remote migration/recreate step, so a
# newer main run waits (GitHub keeps only the newest pending run) instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint, typecheck and frontend build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare npm cache directory
        run: mkdir -p "$HOME/.npm"

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build frontend, typecheck and check translations
        run: >-
          docker run --rm
          --volume "$HOME/.npm:/root/.npm"
          --volume "$GITHUB_WORKSPACE/frontend:/workspace"
          --workdir /workspace
          node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
          sh -ec 'npm ci && npm run build && npm run i18n:check && npm run check:architecture && npm run test:api && npm run test:http && npm run test:analytics && npm run test:dates && npm run test:cccd-qr'

  test-zalo-gateway:
    name: Zalo gateway tests (no provider calls)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test encrypted sessions, VietQR and delivery replay
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/zalo-gateway:/workspace" --workdir /workspace
          node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
          sh -ec 'npm ci && npm test'
      - name: Test WhatsApp gateway encrypted sessions and delivery replay
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/whatsapp-gateway:/workspace" --workdir /workspace
          node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
          sh -ec 'npm ci && npm test'

  test-backend:
    name: Backend tests and migration checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: roomie_qa_ci
          POSTGRES_USER: room_rental
          POSTGRES_PASSWORD: ci-only-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U room_rental -d roomie_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare NuGet cache directory
        run: mkdir -p "$HOME/.nuget/packages"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test backup retention
        run: python3 -m unittest discover -s tests -p 'test_backup_*.py' -v

      - name: Test host collector
        run: python3 -m unittest discover -s tests -p 'test_host_collector.py' -v

      - name: Verify database role permissions on isolated PostgreSQL
        run: python3 tests/check_db_roles.py

      - name: Build backend
        run: >-
          docker run --rm
          --volume "$HOME/.nuget/packages:/root/.nuget/packages"
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
          dotnet build backend/RoomRental.Api/RoomRental.Api.csproj
          --configuration Release --nologo

      - name: Run payment service tests
        run: >-
          docker run --rm --network host
          --env TEST_HTTP_POSTGRES_CONTAINER=${{ job.services.postgres.id }}
          --env TEST_HTTP_POSTGRES_CONNECTION="Host=127.0.0.1;Port=5432;Database=roomie_qa_ci;Username=room_rental;Password=ci-only-db-password"
          --volume "$HOME/.nuget/packages:/root/.nuget/packages"
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
          dotnet run --project tests/RoomRental.WebhookTests/RoomRental.WebhookTests.csproj
          --configuration Release

      - name: Run Zalo reminder service tests
        run: >-
          docker run --rm --network host
          --env TEST_HTTP_POSTGRES_CONTAINER=${{ job.services.postgres.id }}
          --env TEST_HTTP_POSTGRES_CONNECTION="Host=127.0.0.1;Port=5432;Database=roomie_qa_ci;Username=room_rental;Password=ci-only-db-password"
          --volume "$HOME/.nuget/packages:/root/.nuget/packages"
          --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace
          mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
          dotnet run --project tests/RoomRental.ZaloTests --configuration Release

      - name: Check migration snapshots for PostgreSQL
        run: >-
          docker run --rm
          --volume "$HOME/.nuget/packages:/root/.nuget/packages"
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
          sh -ec 'dotnet tool restore &&
          dotnet restore backend/RoomRental.Api --force &&
          dotnet ef migrations has-pending-model-changes --project backend/RoomRental.Api --context PostgresAppDbContext --configuration Release --no-build'

  test-e2e:
    name: Playwright E2E smoke tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare npm cache directory
        run: mkdir -p "$HOME/.npm"

      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Browser smoke tests (synthetic API only)
        run: >-
          docker run --rm --ipc=host
          --volume "$HOME/.npm:/root/.npm"
          --volume "$GITHUB_WORKSPACE/frontend:/workspace" --workdir /workspace
          mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
          sh -ec 'npm ci && npm run build && npm run test:e2e'

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-traces
          path: frontend/test-results
          retention-days: 3

  integration:
    name: API integration suite and image verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: roomie_qa_ci
          POSTGRES_USER: room_rental
          POSTGRES_PASSWORD: ci-only-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U room_rental -d roomie_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image and run API integration suite on disposable PostgreSQL
        env:
          CI_POSTGRES_PASSWORD: ci-only-db-password
          TEST_HTTP_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MONITORING_ALERT_TO: ${{ github.ref == 'refs/heads/main' && vars.MONITORING_ALERT_TO || '' }}
        run: |
          set -euo pipefail
          image="rehouse-ci:${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --build-arg MONITORING_ALERT_TO \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$image" .
          docker image inspect "$image" --format '{{json .Config.Env}}' | python3 -c '
          import json, os, sys
          expected = "MONITORING_ALERT_TO=" + os.environ.get("MONITORING_ALERT_TO", "")
          assert expected in json.load(sys.stdin), "Image alert recipient differs from deployment setting"
          print("Deployment alert recipient embedded successfully")'
          TEST_HTTP_POSTGRES_CONNECTION="Host=127.0.0.1;Port=5432;Database=roomie_qa_ci;Username=room_rental;Password=${CI_POSTGRES_PASSWORD}" \
            python3 tests/run_disposable.py --image "$image" --provider postgres
          TEST_HTTP_POSTGRES_CONNECTION="Host=127.0.0.1;Port=5432;Database=roomie_qa_ci;Username=room_rental;Password=${CI_POSTGRES_PASSWORD}" \
            python3 tests/run_disposable.py --image "$image" --provider otp-postgres
          mkdir -p artifacts
          docker save "$image" | gzip > artifacts/verified-image.tar.gz

      - name: Upload the tested image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-image
          path: artifacts/verified-image.tar.gz
          retention-days: 2

  publish:
    name: Publish immutable image
    needs: [lint-and-typecheck, test-backend, test-zalo-gateway, test-e2e, integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image
          path: artifacts

      - name: Promote the tested image
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the image identity accepted by the VPS after repository renames.
          image_name="ghcr.io/nhaq0505/rehouse"
          image_tag="${image_name}:${GITHUB_SHA}"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          gzip -dc artifacts/verified-image.tar.gz | docker load
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "rehouse-ci:${GITHUB_SHA}")" = "$GITHUB_SHA"
          docker tag "rehouse-ci:${GITHUB_SHA}" "$image_tag"
          docker push "$image_tag"

          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          if [[ ! "$image_ref" =~ ^ghcr\.io/nhaq0505/rehouse@sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve the pushed image digest." >&2
            exit 1
          fi
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Serialize production deploys across runs/workflow_dispatch and never cancel one in flight.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy image digest over pinned SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set the production DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Set the production DEPLOY_USER secret}"
          : "${DEPLOY_PORT:?Set the production DEPLOY_PORT secret}"
          : "${DEPLOY_SSH_KEY:?Set the production DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the production DEPLOY_KNOWN_HOSTS secret}"
          : "${GHCR_TOKEN:?The workflow GITHUB_TOKEN is unavailable}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ||
                ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ||
                ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ||
                "$DEPLOY_PORT" -lt 1 || "$DEPLOY_PORT" -gt 65535 ]]; then
            echo "Invalid deployment host, user, or port configuration." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/nhaq0505/rehouse@sha256:[a-f0-9]{64}$ ]]; then
            echo "The published image reference is missing or invalid." >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/rehouse-deploy-key"
          known_hosts_file="$RUNNER_TEMP/rehouse-known-hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          host_key_name="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then
            host_key_name="[${DEPLOY_HOST}]:${DEPLOY_PORT}"
          fi
          if ! ssh-keygen -F "$host_key_name" -f "$known_hosts_file" >/dev/null; then
            echo "Pinned host key is missing for the configured deployment endpoint." >&2
            exit 1
          fi

          echo "::add-mask::$GHCR_TOKEN"
          printf '%s\n' "$GHCR_TOKEN" | ssh -T \
            -i "$key_file" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${IMAGE_REF}"

      - name: Verify public production health endpoint
        run: >-
          curl --fail --retry 10 --retry-delay 5
          --max-time 15
          https://roomie.io.vn/api/health
