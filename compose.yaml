name: phongtro

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: room_rental
      POSTGRES_USER: room_rental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_rental -d room_rental"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: Postgres
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=room_rental;Username=room_rental;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DataProtection__KeysPath: /app/data/keys
      PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
      WebhookBaseUrl: ${WEBHOOK_BASE_URL:-${PUBLIC_BASE_URL:-http://localhost:8080}}
      TrustedProxies: ${TRUSTED_PROXIES:-}
      Seo__AllowIndexing: ${SEO_ALLOW_INDEXING:-true}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: ${SMTP_FROM_NAME:-Roomie}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Monitoring__Schedule__IncidentChecksEnabled: ${MONITORING_INCIDENT_CHECKS_ENABLED:-true}
      Monitoring__Schedule__MaintenanceEnabled: ${MONITORING_MAINTENANCE_ENABLED:-true}
      Monitoring__Alerts__Enabled: ${MONITORING_ALERTS_ENABLED:-true}
      Monitoring__Alerts__AlertEmailTo: ${MONITORING_ALERT_TO:-}
      SeedDemo: "false"
    volumes:
      - app_keys:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  app_keys:

